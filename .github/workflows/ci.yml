# Builds the JAR and runs the browser tests against a real Keycloak on every pull request
# and push to main, once per Keycloak version the theme must work on. Screenshots of every
# page are kept as an artifact per version for review.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with KEYCLOAK_VERSIONS in the Makefile: production's version and the next.
        keycloak: ["26.5.3", "26.8.1"]
    env:
      KEYCLOAK_VERSION: ${{ matrix.keycloak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      - run: make test-image
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.keycloak }}
          path: test/out/${{ matrix.keycloak }}/
          if-no-files-found: ignore
      - if: always()
        run: make preview-down
