# Builds the JAR and runs the browser tests against a real Keycloak on every pull request
# and push to main. Screenshots of every page are kept as an artifact for review.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      - name: image builds and holds only the JAR
        run: |
          make image
          id=$(docker create ghcr.io/aldersfors/keycloak-theme:dev)
          files=$(docker export "$id" | tar -t | grep -v '/$')
          docker rm "$id" >/dev/null
          echo "$files"
          test "$files" = "keycloak-theme-halsingland.jar"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/out/
          if-no-files-found: ignore
      - if: always()
        run: make preview-down
